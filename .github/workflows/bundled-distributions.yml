# Builds one plugin distribution per platform with the `by` / `buff` binaries inside it
# (FEATURES.md §58, `BundledBinaries`).
#
# Everything here is packaging, not compiling: the binaries are downloaded as prebuilt release
# assets from the basedpython repository, so a single Linux runner can produce the mac and Windows
# zips too. The matrix exists for parallelism and for one artifact per platform, not because the
# jobs need different operating systems.
#
# Why one zip per platform: `by` is ~200 MB, so a single distribution carrying all six targets
# would be several gigabytes. Marketplace routes per-OS/arch artifacts as of 2026.1 — each build
# carries a `-{os}-{arch}` version suffix and `<depends>` on the matching
# `com.intellij.modules.os.*` / `com.intellij.modules.arch.*` (see build.gradle.kts), and
# Marketplace serves each IDE the one it can run. So these are one plugin with six versions, not
# six downloads, and a release uploads all of them.
#
# That mechanism is undocumented and self-described as experimental (MP-1896 is still open) and the
# IntelliJ Platform Gradle Plugin has no support for it, which is why the gating is patched in by
# hand and why the artifacts are checked for it before anything is uploaded.
#
# Releasing: create a GitHub release whose tag is `v<version>` — publishing it runs this workflow,
# which builds the six bundles, attaches them to the release, publishes them to Marketplace, and
# rolls the changelog's Unreleased section over to that version. The tag is the version: `v1.2.3`
# builds plugin 1.2.3 and bundles the basedpython toolchain release of the same name. A manual
# dispatch builds artifacts only, unless `publish` is ticked.
#
# Marketplace secrets, all read from the environment by the IntelliJ Platform Gradle Plugin:
#   PUBLISH_TOKEN         — Marketplace personal access token (required to publish)
#   CERTIFICATE_CHAIN     — signing certificate chain (optional; unsigned installs warn the user)
#   PRIVATE_KEY           — signing private key
#   PRIVATE_KEY_PASSWORD  — its password
# signPlugin runs automatically before publishPlugin when the three signing variables are set, and
# is skipped when they are not, so nothing here has to branch on whether signing is configured.

name: Bundled distributions

on:
  workflow_dispatch:
    inputs:
      basedpython-version:
        description: 'basedpython release to bundle (bare x.y.z, no leading v)'
        required: true
        type: string
      plugin-version:
        description: 'Plugin version to stamp (bare x.y.z; defaults to the one in gradle.properties)'
        required: false
        default: ''
        type: string
      basedpython-repo:
        description: 'GitHub repo holding the by/buff release assets'
        required: false
        default: 'basedpython/basedpython'
        type: string
      publish:
        description: 'Upload every built artifact to JetBrains Marketplace'
        required: false
        default: false
        type: boolean
  release:
    types: [ prereleased, released ]

concurrency:
  group: bundled-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: ${{ matrix.platform }}
    runs-on: ubuntu-latest
    permissions:
      # Write only for the "attach to the release" step, which a manual run never reaches.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # Slugs from ByBinaryDownloadPlan.Platform — the asset names, the marker file and the
        # runtime platform check all agree on these.
        platform: [mac-arm64, mac-x64, linux-x64, linux-arm64, windows-x64, windows-arm64]

    steps:
      - uses: actions/checkout@v4
        with:
          # A release event's default checkout is the tag's commit already, but naming it means a
          # release cut from an older commit builds that commit rather than whatever master is now.
          ref: ${{ github.event.release.tag_name || github.ref }}

      # JDK 25: the build sets no toolchain, so it compiles against whatever JVM Gradle runs on,
      # and the plugin currently ships Java 25 bytecode to match the 2026.2 platform's runtime.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # The tag is the source of truth for a release, gradle.properties only for a dispatch that
      # names no version. Marketplace keys updates by version string and rejects one it has already
      # seen, so a release that stamped the development version would be unpublishable a second
      # time — hence resolving it here rather than relying on the checked-in default.
      - name: Resolve the versions
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
          INPUT_BASEDPYTHON: ${{ inputs.basedpython-version }}
          INPUT_PLUGIN: ${{ inputs.plugin-version }}
        run: |
          set -euo pipefail
          tag="${TAG#v}"

          # A tag bundles the toolchain release of the same name: v1.2.3 -> 1.2.3.
          basedpython="${INPUT_BASEDPYTHON:-$tag}"
          if [ -z "$basedpython" ]; then
            echo "No basedpython version: not a release, and none given" >&2
            exit 1
          fi
          echo "basedpython=$basedpython" >> "$GITHUB_OUTPUT"

          # Empty means "leave gradle.properties alone", which is only reachable from a dispatch.
          plugin="${INPUT_PLUGIN:-$tag}"
          if [ -n "$plugin" ]; then
            echo "plugin-arg=-Pversion=$plugin" >> "$GITHUB_OUTPUT"
          else
            echo "plugin-arg=" >> "$GITHUB_OUTPUT"
          fi
          echo "bundling basedpython $basedpython as plugin version ${plugin:-<gradle.properties>}"

      - name: Download by/buff for ${{ matrix.platform }}
        env:
          REPO: ${{ inputs.basedpython-repo || 'basedpython/basedpython' }}
          VERSION: ${{ steps.version.outputs.basedpython }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          # Mirrors ByBinaryDownloadPlan.downloadUrl: <base>/v<version>/<binary>-<slug>[.exe]
          case "$PLATFORM" in
            windows-*) exe=".exe" ;;
            *)         exe="" ;;
          esac
          mkdir -p build/bundled-binaries
          for binary in by buff; do
            curl --fail --location --retry 3 --retry-delay 5 \
              --output "build/bundled-binaries/${binary}${exe}" \
              "https://github.com/${REPO}/releases/download/v${VERSION}/${binary}-${PLATFORM}${exe}"
          done
          chmod +x build/bundled-binaries/*
          ls -l build/bundled-binaries

      - name: Build the bundled distribution
        run: >
          ./gradlew buildPlugin
          ${{ steps.version.outputs.plugin-arg }}
          -PbundledBinariesDir=build/bundled-binaries
          -PbundledPlatform=${{ matrix.platform }}

      # Two ways this build can look perfectly good and be wrong on a user's machine: the binaries
      # silently missing ("no by found"), and the OS/arch gating silently missing — an ungated
      # artifact is one Marketplace would hand to *every* machine, including the ones whose CPU
      # cannot run the binaries inside it. Both are cheap to assert and invisible otherwise.
      - name: Verify the zip is complete and gated
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          zip=$(ls build/distributions/*-"$PLATFORM".zip)
          echo "checking $zip"
          case "$PLATFORM" in
            windows-*) exe=".exe" ;;
            *)         exe="" ;;
          esac
          for entry in "bin/by${exe}" "bin/buff${exe}" bin/platform.txt; do
            unzip -l "$zip" | grep -q "/${entry}$" || {
              echo "missing $entry in $zip" >&2
              unzip -l "$zip" >&2
              exit 1
            }
          done

          # plugin.xml lives in the plugin jar inside the zip, so this is a nested extraction.
          os=${PLATFORM%%-*}
          arch=${PLATFORM##*-}
          if [ "$arch" = "x64" ]; then arch=x86_64; fi
          # Match on the platform suffix: the lib directory also holds a searchableOptions jar, and
          # a looser glob would have unzip concatenate both into one unreadable file.
          unzip -p "$zip" "*/lib/*-${PLATFORM}.jar" > /tmp/plugin.jar
          unzip -p /tmp/plugin.jar META-INF/plugin.xml > /tmp/plugin.xml
          for module in "com.intellij.modules.os.${os}" "com.intellij.modules.arch.${arch}"; do
            grep -q "<depends>${module}</depends>" /tmp/plugin.xml || {
              echo "missing gating <depends>${module}</depends> in $zip" >&2
              grep '<depends' /tmp/plugin.xml >&2
              exit 1
            }
          done
          grep -o "<version>[^<]*</version>" /tmp/plugin.xml | head -1

      - uses: actions/upload-artifact@v4
        with:
          name: basedpython-plugin-${{ matrix.platform }}
          path: build/distributions/*-${{ matrix.platform }}.zip
          if-no-files-found: error

      # Releases publish; a manual run only produces artifacts, so a bundle can be built and checked
      # without touching a release.
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          PLATFORM: ${{ matrix.platform }}
        run: gh release upload "$TAG" build/distributions/*-"$PLATFORM".zip --clobber

      # Each matrix job uploads its own version, so one release puts all six on Marketplace; a job
      # that failed its checks above never gets here, which is the point of ordering it last. Every
      # upload is a separate review-able version, and Marketplace rejects a version string it has
      # already seen — so re-running a published version needs the plugin version bumped, not a
      # retry.
      - name: Publish to JetBrains Marketplace
        if: github.event_name == 'release' || inputs.publish
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: >
          ./gradlew publishPlugin
          ${{ steps.version.outputs.plugin-arg }}
          -PbundledBinariesDir=build/bundled-binaries
          -PbundledPlatform=${{ matrix.platform }}

  # Roll CHANGELOG.md's Unreleased section over to the version that just shipped, once, after all
  # six uploads succeeded. Once, because patchChangelog rewrites a file in the repository and six
  # matrix jobs doing it in parallel would each throw their copy away.
  changelog:
    name: Roll the changelog over
    needs: bundle
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The tag's commit is not a branch, and the patched changelog has to land on one.
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Patch and commit
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          ./gradlew patchChangelog "-Pversion=${TAG#v}"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # Nothing to do when the release was cut from an already-patched changelog.
          git diff --quiet CHANGELOG.md && { echo "changelog already current"; exit 0; }
          git commit -m "Changelog update - $TAG" CHANGELOG.md
          git push
