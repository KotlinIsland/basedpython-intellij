Negates the condition of an <code>if</code> with an <code>else</code> and swaps the two suites. A comparison's operator is flipped only where the negation means the same, so a float's <code>x &gt; 1</code> becomes <code>not (x &gt; 1)</code>, which is not <code>x &lt;= 1</code> for <code>nan</code>.
