<?xml version="1.0" encoding="UTF-8"?>
<!--
  Tool window stripe icon: a circular arrow — the "this ran again" metaphor, which is the whole
  subject of the window. Monochrome in the platform's stripe style (#6C707E light / #CED0D6 dark),
  because a stripe button sits among the platform's own icons and a coloured badge does not belong
  there.

  The ring is stroked at the same 1.2 weight as the rest of this set, so the five stripe buttons
  read as one family; the head is a filled triangle, the way the flask's liquid is filled. Drawn as
  a stroked chevron first and measured at the size it is actually seen at: at 16px its two hairlines
  and the hairline arc they cap fall in the same three pixels and the corner greys into a smudge,
  while a solid head still reads as a head. The gap is left wide — the arc stops at 315° and the
  head caps it at 250° — because a tip that comes back round to within a pixel or two of the arc's
  own start closes the ring up and the arrow becomes an O.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none">
  <path d="M11.54 4.46A5 5 0 1 1 6.29 3.3"
        stroke="#6C707E" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M9.11 2.27 6.8 4.71 5.78 1.89z" fill="#6C707E"/>
</svg>
