group = dev.basedpython
# The version a plain `./gradlew buildPlugin` produces. A release overrides it from the tag
# (`-Pversion=1.2.3`, see .github/workflows/bundled-distributions.yml), so this is the
# development value, not the source of truth for what Marketplace receives.
version = 0.1.0

pluginRepositoryUrl = https://github.com/KotlinIsland/basedpython-intellij

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
#org.gradle.configuration-cache = true

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true

kotlin.daemon.jvmargs=-Xmx128000000000